name: Publish installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require version tag matching CMake
        run: |
          version=$(sed -n 's/.*project(ascii-video-cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"
  build:
    needs: validate-version
    uses: ./.github/workflows/build.yml
    with:
      release: true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release
      - name: Add application sources and checksums
        run: |
          git archive --format=zip --prefix=ascii-video-cpp/ HEAD > release/application-source.zip
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "ASCII Video ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
